# Elasticsearch (StatefulSet, single node - discovery.type=single-node,
# matching the compose service). Client-facing Service is named
# "elasticsearch-oai" to match the hostname baked into oai-elasticsearch.yml,
# fiz-oai-backend.properties and the check/init shell scripts.
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-oai-headless
  namespace: fiz-oai
  labels:
    app.kubernetes.io/name: elasticsearch-oai
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: elasticsearch-oai
  ports:
    - name: http
      port: 9200
    - name: transport
      port: 9300
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-oai
  namespace: fiz-oai
  labels:
    app.kubernetes.io/name: elasticsearch-oai
spec:
  selector:
    app.kubernetes.io/name: elasticsearch-oai
  ports:
    - name: http
      port: 9200
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch-oai
  namespace: fiz-oai
  labels:
    app.kubernetes.io/name: elasticsearch-oai
spec:
  serviceName: elasticsearch-oai-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch-oai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch-oai
    spec:
      # Makes freshly provisioned PVCs group-writable by 1000 so the
      # elasticsearch process (runAsUser/Group 1000, matching the compose
      # "user: 1000:1000") can write to them.
      securityContext:
        fsGroup: 1000
      initContainers:
        # Required by Elasticsearch (mmap-based storage). Needs a node that
        # allows privileged init containers; ask the cluster admin to raise
        # this via /etc/sysctl.d on nodes instead if privileged pods are
        # disallowed, and drop this initContainer.
        - name: increase-vm-max-map-count
          image: busybox:1.36
          command: ["sysctl", "-w", "vm.max_map_count=262144"]
          securityContext:
            privileged: true
      containers:
        - name: elasticsearch-oai
          image: docker.elastic.co/elasticsearch/elasticsearch:7.17.28
          env:
            - name: bootstrap.memory_lock
              value: "true"
            - name: ES_JAVA_OPTS
              value: "-Dlog4j2.formatMsgNoLookups=true -Xms2g -Xmx2g"
            - name: LOG4J_FORMAT_MSG_NO_LOOKUPS
              value: "true"
            - name: discovery.type
              value: single-node
          ports:
            - name: http
              containerPort: 9200
            - name: transport
              containerPort: 9300
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              add: ["IPC_LOCK"]
          resources:
            requests:
              cpu: "1"
              memory: 3Gi
            limits:
              memory: 4Gi
          startupProbe:
            exec:
              command: ["/checkEsHealth.sh"]
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["/checkEsHealth.sh"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 20
          volumeMounts:
            - name: es-logs
              mountPath: /usr/share/elasticsearch/logs
            - name: es-data
              mountPath: /usr/share/elasticsearch/es-data
            - name: es-backup
              mountPath: /usr/share/elasticsearch/backup
            - name: elasticsearch-config
              mountPath: /usr/share/elasticsearch/config/elasticsearch.yml
              subPath: elasticsearch.yml
            - name: elasticsearch-scripts
              mountPath: /checkEsHealth.sh
              subPath: checkEsHealth.sh
      volumes:
        - name: es-logs
          emptyDir: {}
        - name: elasticsearch-config
          configMap:
            name: elasticsearch-config
        - name: elasticsearch-scripts
          configMap:
            name: elasticsearch-scripts
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: es-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
    - metadata:
        name: es-backup
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
