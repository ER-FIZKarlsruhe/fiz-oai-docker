apiVersion: v1
kind: Service
metadata:
  name: oai-backend
  namespace: fiz-oai
  labels:
    app.kubernetes.io/name: oai-backend
spec:
  selector:
    app.kubernetes.io/name: oai-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oai-backend
  namespace: fiz-oai
  labels:
    app.kubernetes.io/name: oai-backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: oai-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oai-backend
    spec:
      imagePullSecrets:
        - name: fiz-registry-credentials
      # Equivalent of the compose depends_on conditions: wait for the
      # keyspace (created by the cassandra-oai-setup Job) and the ES index
      # (created by the elasticsearch-oai-setup Job) to actually exist,
      # rather than just waiting for the Jobs to be scheduled.
      initContainers:
        - name: wait-for-cassandra-keyspace
          image: cassandra:4.1.7
          envFrom:
            - secretRef:
                name: cassandra-credentials
          command:
            - sh
            - -c
            - |
              until cqlsh cassandra 9042 -u "${CASSANDRA_USER}" -p "${CASSANDRA_PASSWORD}" -e "DESCRIBE KEYSPACE fizoaibackend;" >/dev/null 2>&1; do
                echo "waiting for fizoaibackend keyspace"
                sleep 5
              done
        - name: wait-for-elasticsearch-index
          image: curlimages/curl:8.9.1
          command:
            - sh
            - -c
            - |
              until curl -sf -o /dev/null http://elasticsearch-oai:9200/items; do
                echo "waiting for items index"
                sleep 5
              done
      containers:
        - name: oai-backend
          image: docker.dev.fiz-karlsruhe.de/oai-backend:1.6.5
          env:
            - name: LOG4J_FORMAT_MSG_NO_LOOKUPS
              value: "true"
            - name: CATALINA_OPTS
              value: "-Dlog4j2.formatMsgNoLookups=true -Dorg.apache.tomcat.util.buf.UDecoder.ALLOW_ENCODED_SLASH=true"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            exec:
              command: ["/checkBackendHealth.sh"]
            periodSeconds: 10
            failureThreshold: 20
          livenessProbe:
            exec:
              command: ["/checkBackendHealth.sh"]
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - name: oai-backend-properties
              mountPath: /usr/local/tomcat/conf/fiz-oai-backend.properties
              subPath: fiz-oai-backend.properties
              readOnly: true
            - name: oai-backend-scripts
              mountPath: /checkBackendHealth.sh
              subPath: checkBackendHealth.sh
            - name: oai-backend-logs
              mountPath: /usr/local/tomcat/logs
      volumes:
        - name: oai-backend-properties
          secret:
            secretName: oai-backend-properties
        - name: oai-backend-scripts
          configMap:
            name: oai-backend-scripts
            defaultMode: 0555
        - name: oai-backend-logs
          emptyDir: {}
