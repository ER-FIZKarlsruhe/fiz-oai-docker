# ---------------------------------------------------------------------------
# CHANGE ME before applying to a real cluster.
#
# These Secrets replace the @@CASSANDRA_PASSWORD@@ / @@CASSANDRA_SUPERUSER_PASSWORD@@
# placeholders that install_with_cassandra.sh used to sed-replace into
# configs/cassandra/jmxremote.password and configs/oai_backend/fiz-oai-backend.properties.
#
# For a production cluster, do not commit real secrets to git - manage these
# with sealed-secrets, SOPS or an external-secrets operator instead and keep
# this file as a documented template.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: cassandra-credentials
  namespace: fiz-oai
type: Opaque
stringData:
  CASSANDRA_USER: fizoaibackend
  CASSANDRA_PASSWORD: CHANGE_ME
  CASSANDRA_SUPERUSER_PASSWORD: CHANGE_ME
  CASSANDRA_ADMIN_EMAIL: your@email.de
---
# JMX remote-monitoring password file, mounted read-only into the Cassandra
# container at /etc/cassandra/jmxremote.password. Keep CASSANDRA_PASSWORD (above)
# in sync with the "fizoaibackend" entry below.
apiVersion: v1
kind: Secret
metadata:
  name: cassandra-jmx-password
  namespace: fiz-oai
type: Opaque
stringData:
  jmxremote.password: |
    monitorRole QED
    controlRole R&D
    fizoaibackend CHANGE_ME
---
# Rendered fiz-oai-backend.properties (contains the Cassandra credentials, so
# it lives in a Secret rather than a ConfigMap). Keep cassandra.username /
# cassandra.password in sync with cassandra-credentials above.
apiVersion: v1
kind: Secret
metadata:
  name: oai-backend-properties
  namespace: fiz-oai
type: Opaque
stringData:
  fiz-oai-backend.properties: |
    cassandra.keyspace=fizoaibackend
    cassandra.nodes=cassandra:9042
    cassandra.username=fizoaibackend
    cassandra.password=CHANGE_ME
    cassandra.replication.factor={ 'class' : 'SimpleStrategy', 'replication_factor' : 1 }
    cassandra.datacenter=dc1
    elasticsearch.host=elasticsearch-oai
    elasticsearch.port=9200
    class.impl.search=de.fiz.oai.backend.service.impl.EsSearchServiceImpl

    #decide if deleted records still persist in the database
    #Values can be persistent, no and transient
    #see https://www.openarchives.org/OAI/openarchivesprotocol.html#DeletedRecords
    deletedRecord=persistent
---
# Equivalent of configs/.cassandra_dump_env, consumed by the cassandra-backup
# sidecar via envFrom. CASSAREAD_PWD/EXIM_PASSWD are credentials, the rest is
# non-sensitive but kept together here to mirror the original single env file.
apiVersion: v1
kind: Secret
metadata:
  name: cassandra-backup-env
  namespace: fiz-oai
type: Opaque
stringData:
  CASSANDRA_HOME: /opt/cassandra
  CASSANDRA_DATA: /source_data/data
  CASSANDRA_BACKUP: /backup
  NUM_SNAPSHOTS: "10"
  ADMIN_EMAIL: your@email.de
  LOGFILE: /logs/cron.log
  CASSANDRA_HOST: cassandra
  CASSANDRA_PORT: "7199"
  EXIM_SMARTHOST: your.webserver
  EXIM_PASSWD: ""
  MAIL_FROM: noreply@from.you
  MAIL_INSTANCE: RADAR_DEV
  CASSAREAD_PWD: CHANGE_ME
