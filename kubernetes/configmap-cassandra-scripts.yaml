apiVersion: v1
kind: ConfigMap
metadata:
  name: cassandra-jmx-access
  namespace: fiz-oai
data:
  jmxremote.access: |
    ######################################################################
    #     Default Access Control File for Remote JMX(TM) Monitoring
    ######################################################################
    #
    # Access control file for Remote JMX API access to monitoring.
    # This file defines the allowed access for different roles.  The
    # password file (jmxremote.password by default) defines the roles and their
    # passwords.  To be functional, a role must have an entry in
    # both the password and the access files.
    #
    # The default location of this file is $JRE/lib/management/jmxremote.access
    # You can specify an alternate location by specifying a property in
    # the management config file $JRE/lib/management/management.properties
    # (See that file for details)
    #
    # The file format for password and access files is syntactically the same
    # as the Properties file format.  The syntax is described in the Javadoc
    # for java.util.Properties.load.
    # A typical access file has multiple lines, where each line is blank,
    # a comment (like this one), or an access control entry.
    #
    # An access control entry consists of a role name, and an
    # associated access level.  The role name is any string that does not
    # itself contain spaces or tabs.  It corresponds to an entry in the
    # password file (jmxremote.password).  The access level is one of the
    # following:
    #       "readonly" grants access to read attributes of MBeans.
    #                   For monitoring, this means that a remote client in this
    #                   role can read measurements but cannot perform any action
    #                   that changes the environment of the running program.
    #       "readwrite" grants access to read and write attributes of MBeans,
    #                   to invoke operations on them, and optionally
    #                   to create or remove them. This access should be granted
    #                   only to trusted clients, since they can potentially
    #                   interfere with the smooth operation of a running program.
    #
    # The "readwrite" access level can optionally be followed by the "create" and/or
    # "unregister" keywords.  The "unregister" keyword grants access to unregister
    # (delete) MBeans.  The "create" keyword grants access to create MBeans of a
    # particular class or of any class matching a particular pattern.  Access
    # should only be granted to create MBeans of known and trusted classes.
    #
    # For example, the following entry would grant readwrite access
    # to "controlRole", as well as access to create MBeans of the class
    # javax.management.monitor.CounterMonitor and to unregister any MBean:
    #  controlRole readwrite \
    #              create javax.management.monitor.CounterMonitorMBean \
    #              unregister
    # or equivalently:
    #  controlRole readwrite unregister create javax.management.monitor.CounterMBean
    #
    # The following entry would grant readwrite access as well as access to create
    # MBeans of any class in the packages javax.management.monitor and
    # javax.management.timer:
    #  controlRole readwrite \
    #              create javax.management.monitor.*,javax.management.timer.* \
    #              unregister
    #
    # The \ character is defined in the Properties file syntax to allow continuation
    # lines as shown here.  A * in a class pattern matches a sequence of characters
    # other than dot (.), so javax.management.monitor.* matches
    # javax.management.monitor.CounterMonitor but not
    # javax.management.monitor.foo.Bar.
    #
    # A given role should have at most one entry in this file.  If a role
    # has no entry, it has no access.
    # If multiple entries are found for the same role name, then the last
    # access entry is used.
    #
    #
    # Default access control entries:
    # o The "monitorRole" role has readonly access.
    # o The "controlRole" role has readwrite access and can create the standard
    #   Timer and Monitor MBeans defined by the JMX API.
    
    monitorRole   readonly
    fizoaibackend readwrite
    controlRole   readwrite \
                  create javax.management.monitor.*,javax.management.timer.* \
                  unregister
    			  
---
# init-fizoai-database.sh, ported to read the Cassandra passwords from the
# environment (CASSANDRA_PASSWORD / CASSANDRA_SUPERUSER_PASSWORD, provided by
# the cassandra-credentials Secret) instead of install_with_cassandra.sh's
# @@..@@ sed placeholders, and to retry until Cassandra's auth service is
# actually ready to serve cqlsh (the wait-for-it/sleep-20 approach from the
# original compose setup is replaced by a bounded retry loop).
apiVersion: v1
kind: ConfigMap
metadata:
  name: cassandra-init-script
  namespace: fiz-oai
data:
  init-fizoai-database.sh: |
    #!/bin/sh
    set -e

    echo "Waiting for Cassandra native transport + auth to accept connections..."
    i=0
    until cqlsh cassandra 9042 -u cassandra -p cassandra -e "DESCRIBE KEYSPACES;" >/dev/null 2>&1; do
      i=$((i + 1))
      if [ "$i" -ge 60 ]; then
        echo "Cassandra did not become ready in time" >&2
        exit 1
      fi
      sleep 5
    done

    echo "Creating keyspace + user fizoaibackend, change password of user cassandra ..."
    cqlsh cassandra 9042 -u cassandra -p cassandra -e "CREATE ROLE IF NOT EXISTS fizoaibackend WITH SUPERUSER = false AND LOGIN = true AND PASSWORD = '${CASSANDRA_PASSWORD}';"

    cqlsh cassandra 9042 -u cassandra -p cassandra -e "CREATE KEYSPACE IF NOT EXISTS fizoaibackend WITH replication = {'class': 'SimpleStrategy', 'replication_factor': '1'};"
    cqlsh cassandra 9042 -u cassandra -p cassandra -e "GRANT ALL PERMISSIONS ON KEYSPACE fizoaibackend to fizoaibackend;"

    cqlsh cassandra 9042 -u cassandra -p cassandra -e "ALTER USER cassandra WITH PASSWORD '${CASSANDRA_SUPERUSER_PASSWORD}';"
