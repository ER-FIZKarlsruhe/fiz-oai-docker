# Equivalent of the cassandra-oai-setup one-shot compose service: creates the
# fizoaibackend role/keyspace and rotates the default "cassandra" superuser
# password. Re-run manually (kubectl delete job/cassandra-oai-setup && kubectl
# apply -f cassandra-init-job.yaml) after changing cassandra-credentials.
apiVersion: batch/v1
kind: Job
metadata:
  name: cassandra-oai-setup
  namespace: fiz-oai
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-cassandra
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z cassandra 9042; do echo "waiting for cassandra:9042"; sleep 5; done
      containers:
        - name: cassandra-oai-setup
          image: cassandra:4.1.7
          command: ["sh", "/scripts/init-fizoai-database.sh"]
          envFrom:
            - secretRef:
                name: cassandra-credentials
          volumeMounts:
            - name: cassandra-init-script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: cassandra-init-script
          configMap:
            name: cassandra-init-script
            defaultMode: 0555
