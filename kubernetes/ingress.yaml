apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fiz-oai
  namespace: fiz-oai
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /oai
            pathType: Prefix
            backend:
              service:
                name: oai-provider
                port:
                  number: 8080
          - path: /oai-backend
            pathType: Prefix
            backend:
              service:
                name: oai-backend
                port:
                  number: 8080