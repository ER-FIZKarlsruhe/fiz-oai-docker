# Requires the ingress-nginx controller (https://kubernetes.github.io/ingress-nginx/):
#   helm upgrade --install ingress-nginx ingress-nginx \
#     --repo https://kubernetes.github.io/ingress-nginx --namespace ingress-nginx --create-namespace
#
# oai-provider owns "/oai" (see Identify.repositoryName / OAIHandler config in
# oaicat.properties) and oai-backend owns "/oai-backend" - both context paths
# are baked into the Tomcat WARs, so no rewrite-target is used here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fiz-oai
  namespace: fiz-oai
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  ingressClassName: nginx
  # tls:
  #   - hosts: ["oai.example.org"]
  #     secretName: fiz-oai-tls
  rules:
    - host: oai.example.org
      http:
        paths:
          - path: /oai
            pathType: Prefix
            backend:
              service:
                name: oai-provider
                port:
                  number: 8080
          - path: /oai-backend
            pathType: Prefix
            backend:
              service:
                name: oai-backend
                port:
                  number: 8080
